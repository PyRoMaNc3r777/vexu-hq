<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXU HQ · Știri</title><style>
*{box-sizing:border-box}body{margin:0;background:#07040f;color:#eee;font-family:system-ui,sans-serif;background-image:radial-gradient(circle at 20% 0,#3b0a5c 0,transparent 50%),radial-gradient(circle at 100% 100%,#002f3d 0,transparent 50%);min-height:100vh}
.w{max-width:900px;margin:auto;padding:16px}h1{font-size:2em;margin:8px 0;text-align:center;background:linear-gradient(90deg,#ff2bd6,#00f0ff);-webkit-background-clip:text;color:transparent}
nav{text-align:center}nav a{color:#00f0ff;margin:0 8px;font-weight:700;text-decoration:none}.p{background:#120a22cc;border:1px solid #ff2bd655;border-radius:16px;margin:14px 0;overflow:hidden;box-shadow:0 0 18px #ff2bd622}
.p img{width:100%;height:190px;object-fit:cover;display:block}.b{padding:14px}h2{margin:6px 0;font-size:1.15em}.l{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.72em;font-weight:800}
.CONFIRMAT{background:#39ff8822;color:#39ff88;border:1px solid #39ff88}.ZVON{background:#ffd40022;color:#ffd400;border:1px solid #ffd400}.s a{color:#ff7be6;font-size:.8em;word-break:break-all;display:block;margin-top:4px}
</style></head><body><div class="w"><h1>📰 VEXU HQ · Știri</h1><nav><a href="index.html">← Înapoi la dashboard</a></nav><div id="posts">Se încarcă…</div></div>
<script>fetch('posts.json?'+Date.now()).then(r=>r.json()).then(ps=>{document.getElementById('posts').innerHTML=ps.map(p=>`<div class="p"><img src="${p.img}" alt=""><div class="b"><span class="l ${p.eticheta}">${p.eticheta}</span><h2>${p.titlu}</h2><div>${p.text}</div><div class="s">Surse:${p.surse.map(s=>`<a href="${s}" target="_blank" rel="noopener">${s}</a>`).join('')}</div></div></div>`).join('')})</script></body></html>
